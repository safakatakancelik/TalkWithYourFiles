name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The oldest supported version and the newest: 3.14 evaluates annotations lazily (PEP 649).
        python: ["3.13", "3.14"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pyright
      - run: uv run pytest --cov=twyf --cov-branch --cov-report=json --cov-fail-under=90
      - run: uv run python scripts/check_coverage.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: npm test

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
        working-directory: backend
      - run: uv run twyf export-contract
        working-directory: backend
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: frontend
      - run: npm run gen:contract
        working-directory: frontend
      - run: git diff --exit-code contract/ frontend/src/backend/contract.gen.ts

  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: uv sync --frozen
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - name: Start the demo server
        run: |
          backend/scripts/run_demo_server.sh > demo-server.log 2>&1 &
          curl -s --retry 60 --retry-delay 1 --retry-connrefused http://127.0.0.1:8321/api/v1/health
      - run: npm test
        working-directory: frontend
        env:
          TWYF_TEST_BACKEND_URL: http://127.0.0.1:8321
      - if: failure()
        run: cat demo-server.log
