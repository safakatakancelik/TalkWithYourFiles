name: tests

on:
  push:
    branches: [main, v2]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # weekly, to notice when a dependency update breaks the app

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
