[project]
name = "twyf"
version = "2.0.0a1"
description = "Talk With Your Files: a backend where agents answer questions about your files, with verified citations"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "pydantic-settings",
    "httpx",
    "mcp>=2,<3",
    "sqlite-vec",
    "numpy",
    "pypdf",
    "python-docx",
    "simpleeval",
    "python-multipart",
]

[project.optional-dependencies]
rich = ["docling-slim[standard]", "fastembed", "torch", "torchvision"]

[project.scripts]
twyf = "twyf.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "pyright",
    "jsonschema",
    "reportlab",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/twyf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = '-m "not models"'
markers = ["models: needs Docling or fastembed models (run by hand)"]

[tool.coverage.run]
# Docling is optional (the rich extra) and needs models: tested by hand with -m models.
omit = ["src/twyf/files/parsers/docling.py"]

[tool.coverage.report]
exclude_also = ["if __name__ == .__main__.:"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"
pythonVersion = "3.13"

# Docling's layout and OCR models run on torch. The CPU-only builds are a fraction of the default Linux ones,
# which bundle the CUDA libraries for a GPU this project does not use.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
